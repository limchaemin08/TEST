    // --- THEORY DATA ---
    const REFLECTIVE_QUESTIONS = [
      {
        id: 'static',
        question: '자석을 코일 안에 넣고 가만히 멈춰두면 왜 전류가 흐르지 않을까요?',
        concept: '자기장의 세기 vs 자기장의 변화율',
        hint: '패러데이 법칙에 따르면 유도기전력은 자기장 자체의 세기가 아니라, 자기장의 시간당 "변화량"에 비례합니다. 자석이 멈춰 있으면 코일을 통과하는 자속의 변화가 0이므로 유도기전력과 유도전류도 0이 됩니다.'
      },

        hint: '자석을 빠르게 움직일수록 코일을 통과하는 자속의 변화 속도(dΦ/dt)가 커집니다. 따라서 유도기전력의 크기(그래프의 진폭)가 훨씬 더 크게 나타나며 검류계 바늘도 더 크게 흔들립니다.'
      },
      {
        id: 'direction',
        question: '자석의 N극을 넣을 때와 뺄 때 검류계 바늘의 방향은 어떻게 되나요? S극일 때는 어떤가요?',
        concept: '렌츠의 법칙 (방해의 법칙)',
        hint: '렌츠의 법칙에 의해 코일은 외부 자기장의 변화를 방해하는 방향으로 유도 자기장을 만듭니다.\n- N극이 접근하면: 청력(밀어내기)을 유도하기 위해 코일 입구에 N극이 생기는 방향으로 전류가 흐릅니다.\n- N극이 후퇴하면: 인력(잡아당기기)을 유도하기 위해 코일 입구에 S극이 생기는 방향으로 전류가 흐릅니다.\nS극은 이와 정확히 반대 방향으로 작동합니다.'

      },

        hint: '코일 면을 수직으로 통과하는 자속은 cos(θ)에 비례합니다. 각도 θ가 0도일 때 cos(0) = 1로 자속이 최대가 되며, 각도가 90도에 가까워질수록 cos(θ)가 0에 수렴하여 자속 변화가 거의 없어집니다. 즉, 각도가 틀어질수록 유도전류가 약해집니다.'
      },
      {

        hint: '더 강력한 자석(예: 네오디뮴)일수록 자석 주변의 자기장 세기 B가 강해져, 자석이 동일한 속도로 움직여도 코일을 통과하는 자속의 변화율(dΦ/dt)이 훨씬 더 커집니다. 따라서 검류계 바늘과 그래프의 전압 진폭이 급격하게 증가합니다.'
      },
      {
        id: 'offset',
        question: '진입 높이(Y-Offset)를 조절하여 자석이 코일 중심을 비껴가게 만들면 유도전류는 어떻게 변하나요?',
        concept: '거리 및 중심축 이탈 효과',
        hint: '자석이 코일의 중심축에서 위나 아래로 크게 벗어날수록(Y-Offset 증가), 코일 도선을 통과하는 자기력선의 밀도와 각도가 틀어져 실질적인 자속 변화량이 급감하게 됩니다. 중심축을 정확히 관통할 때 가장 강력한 유도 전류가 발생합니다.'

    // --- PHYSICS CANVAS ---
    function PhysicsCanvas({ state, setState, onUpdateEmf, theme = 'light' }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      // Dragging state
      const isDraggingRef = useRef(false);
      const dragStartOffsetRef = useRef(0);
      const prevXRef = useRef(0);
      const velocitySmoothRef = useRef(0);

      // Time tracker for animations (e.g. magnetic field lines flow)
      const animTimeRef = useRef(0);
      const autoOscillateTimeRef = useRef(0);

      // Dimensions
      const canvasWidth = 760;
      const canvasHeight = 170;
      const coilCenterX = 480;
      const coilCenterY = 85;
      const magnetLength = 130;
      const magnetHeight = 44;

      // Ref to hold the latest simulation state
      const stateRef = useRef(state);
      useEffect(() => {
        stateRef.current = state;
      }, [state]);

      // React state for hover effect cursor
      const [isHoveringMagnet, setIsHoveringMagnet] = useState(false);

      // Check if coordinates hit the magnet (taking rotation into account slightly)
      const isHitMagnet = (x, y) => {
        const halfL = magnetLength / 2;
        const halfH = magnetHeight / 2;
        
        const dx = x - state.magnetX;
        const dy = y - state.magnetY;
        
        const rad = (state.angle * Math.PI) / 180;
        const rx = dx * Math.cos(-rad) - dy * Math.sin(-rad);
        const ry = dx * Math.sin(-rad) + dy * Math.cos(-rad);

        return Math.abs(rx) <= halfL && Math.abs(ry) <= halfH;
      };

      // Convert client coords to canvas local coordinates with scaling
      const getCanvasCoords = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        
        const rect = canvas.getBoundingClientRect();
        
        let clientX = 0;
        let clientY = 0;
        
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        const scaleX = canvasWidth / rect.width;
        const scaleY = canvasHeight / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      // Drag start
      const handleStart = (e) => {
        if (state.isAutoMoving) return; // Ignore input in auto-oscillation
        
        const coords = getCanvasCoords(e);
        if (isHitMagnet(coords.x, coords.y)) {
          isDraggingRef.current = true;
          dragStartOffsetRef.current = coords.x - state.magnetX;
          prevXRef.current = coords.x;
          velocitySmoothRef.current = 0;
          
          setState(prev => ({ ...prev, isDragging: true }));
          
          // Prevent scrolling on mobile
          if (e.cancelable) {
            e.preventDefault();
          }
        }
      };

      // Drag move
      const handleMove = (e) => {
        const coords = getCanvasCoords(e);
        
        // Update hovering status for cursor style
        if (!state.isAutoMoving && !isDraggingRef.current) {
          setIsHoveringMagnet(isHitMagnet(coords.x, coords.y));
        }

        if (isDraggingRef.current) {
          let targetX = coords.x - dragStartOffsetRef.current;
          targetX = Math.max(90, Math.min(670, targetX)); // Limit horizontal movement

          const instantVelocity = coords.x - prevXRef.current;
          prevXRef.current = coords.x;

          velocitySmoothRef.current = velocitySmoothRef.current * 0.82 + instantVelocity * 0.18;

          // Real-time calculation of Y-coordinate based on offset and trajectory angle (tan θ)
          const rad = (stateRef.current.angle * Math.PI) / 180;
          const targetY = coilCenterY + stateRef.current.yOffset + (targetX - coilCenterX) * Math.tan(rad);

          setState(prev => ({
            ...prev,
            magnetX: targetX,
            magnetY: targetY,
            velocity: velocitySmoothRef.current
          }));

          if (e.cancelable) {
            e.preventDefault();
          }
        }
      };

      // Drag end
      const handleEnd = () => {
        if (isDraggingRef.current) {
          isDraggingRef.current = false;
          setState(prev => ({
            ...prev,
            isDragging: false,
            velocity: 0
          }));
          velocitySmoothRef.current = 0;
        }
      };

      // Animation frame loop
      useEffect(() => {
        let animId;

        const render = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const s = stateRef.current;

          // Handle High DPI and logical canvas scaling
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
          }
          ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
          ctx.scale(dpr * (rect.width / canvasWidth), dpr * (rect.height / canvasHeight));

          // Clear
          ctx.fillStyle = theme === 'dark' ? '#0f172a' : '#f8fafc'; // grid background
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          // Draw horizontal reference guide line / bench rail
          ctx.strokeStyle = theme === 'dark' ? '#1e293b' : '#e2e8f0';
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(60, coilCenterY + 35);
          ctx.lineTo(700, coilCenterY + 35);
          ctx.stroke();

          // Rail support feet
          ctx.fillStyle = theme === 'dark' ? '#334155' : '#94a3b8';
          ctx.fillRect(80, coilCenterY + 35, 12, 10);
          ctx.fillRect(668, coilCenterY + 35, 12, 10);

          // Auto oscillation updates
          let currentX = s.magnetX;
          let currentVel = s.velocity;

          if (s.isAutoMoving) {
            autoOscillateTimeRef.current += 0.022; // time speed
            
            const center = 340;
            const amplitude = 170;
            
            const newX = center + amplitude * Math.sin(autoOscillateTimeRef.current);
            const analyticalVel = amplitude * Math.cos(autoOscillateTimeRef.current) * 0.022 * 60; // scale to frames
            
            const rad = (s.angle * Math.PI) / 180;
            const newY = coilCenterY + s.yOffset + (newX - coilCenterX) * Math.tan(rad);

            currentX = newX;
            currentVel = analyticalVel;

            // Sync with parent state periodically
            setState(prev => {
              if (prev.isAutoMoving) {
                return {
                  ...prev,
                  magnetX: newX,
                  magnetY: newY,
                  velocity: analyticalVel
                };
              }
              return prev;
            });
          } else if (!isDraggingRef.current) {
            // Apply friction to velocity
            currentVel = currentVel * 0.82;
            if (Math.abs(currentVel) < 0.01) currentVel = 0;
            
            if (currentVel !== s.velocity) {
              setState(prev => {
                if (!prev.isDragging && !prev.isAutoMoving) {
                  return { ...prev, velocity: currentVel };
                }
                return prev;
              });
            }
          }

          // Physics Math: Calculate Instantaneous EMF
          const u = currentX - coilCenterX;
          const R = 44; // coil radius
          const L = magnetLength - 20; // effective magnetic dipole length
          
          const x1 = u + L / 2;
          const x2 = u - L / 2;
          
          // Compute actual vertical offset d based on offset and entry angle
          const rad = (s.angle * Math.PI) / 180;
          const d = s.yOffset + (currentX - coilCenterX) * Math.tan(rad);

          const C = 135; // Calibration scaling factor
          // Distance from coil wire scales as R^2 + d^2
          const term1 = 1 / Math.pow(x1 * x1 + R * R + d * d, 1.5);
          const term2 = 1 / Math.pow(x2 * x2 + R * R + d * d, 1.5);
          
          let dPhi_du = C * R * R * (term1 - term2);
          
          // Apply magnet strength level (1: 0.5x, 2: 1.0x, 3: 2.0x)
          const strengthScale = s.magnetStrength === 1 ? 0.5 : s.magnetStrength === 3 ? 2.0 : 1.0;
          dPhi_du *= strengthScale;

          if (s.polarity === 'SN') {
            dPhi_du = -dPhi_du;
          }
          
          // Scale by cos(angle) for cross-sectional area reduction
          const cosAngle = Math.cos(rad);
          dPhi_du *= cosAngle;
          
          let calculatedEmf = -s.turns * dPhi_du * currentVel * 0.25;

          if (s.windingDirection === 'CCW') {
            calculatedEmf = -calculatedEmf;
          }

          onUpdateEmf(calculatedEmf);

          animTimeRef.current += 0.25;

          // 1. Draw BACK half of the coil wire loops
          const loopCount = s.turns;
          const loopSpacing = 16;
          const startX = coilCenterX - ((loopCount - 1) * loopSpacing) / 2;

          ctx.lineWidth = 3.5;
          ctx.lineCap = 'round';

          for (let k = 0; k < loopCount; k++) {
            const cx = startX + k * loopSpacing;
            ctx.strokeStyle = '#b45309'; // Copper wire color back (darker)
            ctx.beginPath();
            ctx.ellipse(cx, coilCenterY, 20, 50, 0, Math.PI / 2, (3 * Math.PI) / 2);
            ctx.stroke();

            if (Math.abs(calculatedEmf) > 0.05) {
              const glowIntensity = Math.min(0.8, Math.abs(calculatedEmf) / 5.5);
              ctx.strokeStyle = calculatedEmf > 0 ? `rgba(6, 182, 212, ${glowIntensity})` : `rgba(245, 158, 11, ${glowIntensity})`;
              ctx.lineWidth = 7;
              ctx.beginPath();
              ctx.ellipse(cx, coilCenterY, 20, 50, 0, Math.PI / 2, (3 * Math.PI) / 2);
              ctx.stroke();
              ctx.lineWidth = 3.5; // restore
            }
          }

          // 2. Draw Magnet and its Magnetic Field Lines
          ctx.save();
          ctx.translate(currentX, s.magnetY);
          ctx.rotate(rad);

          // Magnetic field lines (Dipole loops)
          const lineCount = 5;
          ctx.lineWidth = 1.2;
          
          for (let i = 1; i <= lineCount; i++) {
            const extentY = i * 22;
            const extentX = i * 35 + 15;
            
            ctx.strokeStyle = theme === 'dark' ? 'rgba(148, 163, 184, 0.45)' : 'rgba(100, 116, 139, 0.28)';
            
            const flowDirection = s.polarity === 'NS' ? -1 : 1;
            ctx.setLineDash([6, 10]);
            ctx.lineDashOffset = animTimeRef.current * flowDirection * 1.6;

            // Top loop
            ctx.beginPath();
            ctx.moveTo(magnetLength / 2 - 10, 0);
            ctx.bezierCurveTo(
              magnetLength / 2 + extentX, -extentY,
              -magnetLength / 2 - extentX, -extentY,
              -magnetLength / 2 + 10, 0
            );
            ctx.stroke();

            // Bottom loop
            ctx.beginPath();
            ctx.moveTo(magnetLength / 2 - 10, 0);
            ctx.bezierCurveTo(
              magnetLength / 2 + extentX, extentY,
              -magnetLength / 2 - extentX, extentY,
              -magnetLength / 2 + 10, 0
            );
            ctx.stroke();
          }
          ctx.setLineDash([]);

          // Straight horizontal field line passing through the core
          ctx.strokeStyle = theme === 'dark' ? 'rgba(148, 163, 184, 0.55)' : 'rgba(100, 116, 139, 0.35)';
          ctx.setLineDash([5, 8]);
          ctx.lineDashOffset = animTimeRef.current * (s.polarity === 'NS' ? -1 : 1) * 1.5;
          ctx.beginPath();
          ctx.moveTo(-250, 0);
          ctx.lineTo(250, 0);
          ctx.stroke();
          ctx.setLineDash([]);

          // Draw the Bar Magnet block
          const halfL = magnetLength / 2;
          const halfH = magnetHeight / 2;

          ctx.shadowColor = 'rgba(15, 23, 42, 0.15)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 6;

          // Base Magnet Body
          ctx.fillStyle = s.polarity === 'NS' ? '#1e40af' : '#b91c1c';
          ctx.beginPath();
          ctx.roundRect(-halfL, -halfH, halfL, magnetHeight, [6, 0, 0, 6]);
          ctx.fill();

          ctx.fillStyle = s.polarity === 'NS' ? '#b91c1c' : '#1e40af';
          ctx.beginPath();
          ctx.roundRect(0, -halfH, halfL, magnetHeight, [0, 6, 6, 0]);
          ctx.fill();

          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          // Magnet gloss highlight overlay
          const gradGloss = ctx.createLinearGradient(0, -halfH, 0, halfH);
          gradGloss.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
          gradGloss.addColorStop(0.3, 'rgba(255, 255, 255, 0.08)');
          gradGloss.addColorStop(0.7, 'rgba(0, 0, 0, 0.05)');
          gradGloss.addColorStop(1, 'rgba(0, 0, 0, 0.18)');
          ctx.fillStyle = gradGloss;
          ctx.beginPath();
          ctx.roundRect(-halfL, -halfH, magnetLength, magnetHeight, 6);
          ctx.fill();

          // North & South lettering
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px "Inter", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          const leftLetter = s.polarity === 'NS' ? 'S' : 'N';
          const rightLetter = s.polarity === 'NS' ? 'N' : 'S';

          ctx.fillText(leftLetter, -halfL / 2, 0);
          ctx.fillText(rightLetter, halfL / 2, 0);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -halfH);
          ctx.lineTo(0, halfH);
          ctx.stroke();

          ctx.restore();

          // 3. Draw FRONT half of the coil wire loops
          for (let k = 0; k < loopCount; k++) {
            const cx = startX + k * loopSpacing;
            ctx.strokeStyle = '#d97706'; // Copper wire front (brighter)
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(cx, coilCenterY, 20, 50, 0, (3 * Math.PI) / 2, Math.PI / 2);
            ctx.stroke();

            if (Math.abs(calculatedEmf) > 0.05) {
              const glowIntensity = Math.min(0.9, Math.abs(calculatedEmf) / 5.5);
              ctx.strokeStyle = calculatedEmf > 0 ? `rgba(6, 182, 212, ${glowIntensity})` : `rgba(245, 158, 11, ${glowIntensity})`;
              ctx.lineWidth = 8;
              ctx.beginPath();
              ctx.ellipse(cx, coilCenterY, 20, 50, 0, (3 * Math.PI) / 2, Math.PI / 2);
              ctx.stroke();
              ctx.lineWidth = 4; // restore
            }
          }

          // Draw Coil Support Holder Cylinder (transparency effect)
          ctx.strokeStyle = theme === 'dark' ? 'rgba(148, 163, 184, 0.25)' : 'rgba(148, 163, 184, 0.18)';
          ctx.lineWidth = 2.5;
          ctx.fillStyle = theme === 'dark' ? 'rgba(30, 41, 59, 0.45)' : 'rgba(226, 232, 240, 0.15)';
          ctx.beginPath();
          ctx.roundRect(startX - 25, coilCenterY - 54, (loopCount - 1) * loopSpacing + 50, 108, 12);
          ctx.fill();
          ctx.stroke();

          // Coil Base stand
          ctx.fillStyle = theme === 'dark' ? '#475569' : '#64748b';
          ctx.fillRect(coilCenterX - 12, coilCenterY + 50, 24, 25);
          
          ctx.fillStyle = theme === 'dark' ? '#1e293b' : '#334155';
          ctx.beginPath();
          ctx.roundRect(coilCenterX - 45, coilCenterY + 70, 90, 8, 4);
          ctx.fill();

          // 4. Draw Terminals & Connecting Wires to the Galvanometer
          ctx.strokeStyle = theme === 'dark' ? '#64748b' : '#475569';
          ctx.lineWidth = 2;
          
          const leftWireX = startX - 8;
          ctx.beginPath();
          ctx.moveTo(leftWireX, coilCenterY + 44);
          ctx.lineTo(leftWireX, coilCenterY + 75);
          ctx.lineTo(coilCenterX - 150, coilCenterY + 75);
          ctx.stroke();

          const rightWireX = startX + (loopCount - 1) * loopSpacing + 8;
          ctx.beginPath();
          ctx.moveTo(rightWireX, coilCenterY + 44);
          ctx.lineTo(rightWireX, coilCenterY + 71);
          ctx.lineTo(coilCenterX + 150, coilCenterY + 71);
          ctx.stroke();

          if (Math.abs(calculatedEmf) > 0.05) {
            ctx.strokeStyle = calculatedEmf > 0 ? '#06b6d4' : '#f59e0b';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([6, 12]);
            const flowSign = calculatedEmf > 0 ? -1 : 1;
            ctx.lineDashOffset = animTimeRef.current * flowSign * 2;

            ctx.beginPath();
            ctx.moveTo(leftWireX, coilCenterY + 44);
            ctx.lineTo(leftWireX, coilCenterY + 75);
            ctx.lineTo(coilCenterX - 150, coilCenterY + 75);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(rightWireX, coilCenterY + 44);
            ctx.lineTo(rightWireX, coilCenterY + 71);
            ctx.lineTo(coilCenterX + 150, coilCenterY + 71);
            ctx.stroke();

            ctx.setLineDash([]);
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
        };
      }, [setState, onUpdateEmf, theme]);

      // Sync magnetY when angle or yOffset is changed but not dragging/automoving
      useEffect(() => {
        if (!state.isDragging && !state.isAutoMoving) {
          const rad = (state.angle * Math.PI) / 180;
          const targetY = coilCenterY + state.yOffset + (state.magnetX - coilCenterX) * Math.tan(rad);
          if (Math.abs(state.magnetY - targetY) > 0.1) {
            setState(prev => ({ ...prev, magnetY: targetY }));
          }
        }
      }, [state.angle, state.yOffset, state.magnetX, state.isDragging, state.isAutoMoving, setState]);

      // Handle global mouseUp / touchend
      useEffect(() => {
        const handleGlobalMouseUp = () => {
          handleEnd();
        };
        window.addEventListener('mouseup', handleGlobalMouseUp);
        window.addEventListener('touchend', handleGlobalMouseUp);
        return () => {
          window.removeEventListener('mouseup', handleGlobalMouseUp);
          window.removeEventListener('touchend', handleGlobalMouseUp);
        };
      }, []);

      return (
        <div ref={containerRef} className={`relative w-full aspect-[760/170] rounded-2xl overflow-hidden shadow-inner flex flex-col items-center justify-center border transition-colors duration-300 ${
          theme === 'dark' ? 'bg-slate-950/50 border-slate-800' : 'bg-slate-50 border-slate-100'
        }`}>
          <canvas
            ref={canvasRef}
            onMouseDown={handleStart}
            onMouseMove={handleMove}
            onTouchStart={handleStart}
            onTouchMove={handleMove}
            style={{ cursor: state.isDragging ? 'grabbing' : isHoveringMagnet ? 'grab' : 'default' }}
            className="absolute inset-0 w-full h-full block touch-none"
          />
          <div className="absolute top-3 left-3 flex gap-2 pointer-events-none select-none">
            <span className={`text-[10px] font-semibold px-2 py-1 rounded-md border shadow-sm flex items-center gap-1 transition-colors duration-300 ${
              theme === 'dark' ? 'bg-slate-900/95 text-slate-300 border-slate-800' : 'bg-white/95 text-slate-600 border-slate-200/80'
            }`}>
              <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse" />
              실험실 활성화됨
            </span>
            <span className={`text-[10px] font-semibold px-2 py-1 rounded-md border shadow-sm transition-colors duration-300 ${
              theme === 'dark' ? 'bg-slate-900/95 text-slate-400 border-slate-800' : 'bg-white/95 text-slate-500 border-slate-200/80'
            }`}>
              {state.isAutoMoving ? '자동 왕복 운동 중' : '자석을 드래그하세요'}
            </span>
          </div>
        </div>
      );
    }

    // --- EMF GRAPH (WAVEFORM) ---
    function EmfGraph({ data, theme }) {
      const width = 300;
      const height = 98;
      const maxDataPoints = 60;

      const pathData = useMemo(() => {
        if (data.length < 2) return '';
        const points = data.slice(-maxDataPoints);
        const stepX = width / (maxDataPoints - 1);
        
        return points.map((val, index) => {
          const x = index * stepX;
          const y = (height / 2) - (val / 320) * (height / 2 - 5);
          const clampedY = Math.max(3, Math.min(height - 3, y));
          return `${index === 0 ? 'M' : 'L'} ${x} ${clampedY}`;
        }).join(' ');
      }, [data]);

      return (
        <div className={`p-2.5 rounded-xl border flex flex-col h-full transition-colors duration-300 ${
          theme === 'dark' ? 'bg-slate-900 border-slate-800 shadow-none' : 'bg-white border-slate-100 shadow-sm'
        }`}>
          <div className="flex items-center justify-between pb-1 mb-2 border-b transition-colors duration-300 border-slate-100 dark:border-slate-800">
            <span className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">실시간 유도기전력 (EMF)</span>
            <span className="text-[9px] font-mono font-bold bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-400 px-1.5 py-0.5 rounded">V(t) Graph</span>
          </div>

          <div className="relative flex-grow flex items-center justify-center bg-slate-50 dark:bg-slate-950 rounded-lg overflow-hidden border border-slate-100 dark:border-slate-800 p-1">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
              <line x1="0" y1={height / 2} x2={width} y2={height / 2} stroke={theme === 'dark' ? 'rgba(51, 65, 85, 0.6)' : 'rgba(203, 213, 225, 0.6)'} strokeWidth="1.2" strokeDasharray="4 4" />
              {[1, 2, 3].map(i => (
                <line key={i} x1={(width / 4) * i} y1="0" x2={(width / 4) * i} y2={height} stroke={theme === 'dark' ? 'rgba(51, 65, 85, 0.3)' : 'rgba(203, 213, 225, 0.3)'} strokeWidth="1" strokeDasharray="2 3" />
              ))}
              <text x="3" y="10" fontSize="5" fontWeight="semibold" fill="#ef4444" opacity="0.8">Max (+V)</text>
              <text x="3" y={height / 2 + 1.8} fontSize="4.5" fill={theme === 'dark' ? '#475569' : '#94a3b8'}>0</text>
              <text x="3" y={height - 5} fontSize="5" fontWeight="semibold" fill="#3b82f6" opacity="0.8">Min (-V)</text>

              {pathData && (
                <path d={pathData} fill="none" stroke={theme === 'dark' ? '#fb7185' : '#e11d48'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              )}
            </svg>
          </div>
        </div>
      );
    }

          id: 'mission_ac_generation',
          title: '지속 가능한 교류(AC) 전력 생성',
          description: '자석 자동 왕복 운동 스위치를 켜서 안정적인 교류 사인파 그래프를 3초간 지속해서 관찰해보세요.',
          conditionText: '자동 왕복 운동 활성화 + 3초간 관찰',
          rewardXp: 120,
          progress: Math.min(100, Math.round((autoDuration / 180) * 100)),
          checkFn: (aDur) => aDur >= 180,
        },
      ];

      useEffect(() => {
        const isStill = 
          !isAuto && 
          !isDragging && 
          magnetX >= 430 && 
          magnetX <= 530 && 
          Math.abs(velocity) < 0.5 && 
          Math.abs(emf) < 0.05;

        if (isStill) {
          setStillDuration(p => p + 1);
        } else {
          setStillDuration(0);
        }

        if (isAuto) {
          setAutoDuration(p => p + 1);
        } else {
          setAutoDuration(0);
        }
      }, [magnetX, velocity, emf, isAuto, isDragging]);

      useEffect(() => {
        missions.forEach(mission => {
          if (completedList.includes(mission.id)) return;

          const durationArg = mission.id === 'mission_static_equilibrium' ? stillDuration : (mission.id === 'mission_ac_generation' ? autoDuration : 0);
          const isCompletedNow = mission.checkFn(durationArg);

          if (isCompletedNow) {
            const updatedList = [...completedList, mission.id];
            const updatedXp = xp + mission.rewardXp;
            
            setCompletedList(updatedList);
            setXp(updatedXp);
            
            localStorage.setItem('faraday_completed_missions', JSON.stringify(updatedList));
            localStorage.setItem('faraday_xp', updatedXp.toString());
          }
        });
      }, [magnetX, velocity, emf, isAuto, turns, polarity, isDragging, stillDuration, autoDuration, completedList, xp]);

      const getRank = (score) => {
        if (score >= 500) return { name: '전자기학 마스터 (Master)', color: 'text-amber-500 border-amber-500/20 bg-amber-500/10' };
        if (score >= 300) return { name: '고급 수석 연구원 (Senior)', color: 'text-purple-500 border-purple-500/20 bg-purple-500/10' };
        if (score >= 150) return { name: '학부생 물리 연구원 (Scholar)', color: 'text-indigo-500 border-indigo-500/20 bg-indigo-500/10' };
        return { name: '초급 물리학 학도 (Novice)', color: 'text-slate-500 border-slate-500/20 bg-slate-500/10' };
      };

      const currentRank = getRank(xp);

      const resetProgress = () => {
        if (confirm('모든 도전 과제 성과와 XP 점수를 초기화하시겠습니까?')) {
          setXp(0);
          setCompletedList([]);
          setStillDuration(0);
          setAutoDuration(0);
          localStorage.removeItem('faraday_xp');
          localStorage.removeItem('faraday_completed_missions');
        }
      };

      return (
        <div className={`p-3 rounded-xl border transition-colors duration-300 flex flex-col ${
          theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100 shadow-sm'
        }`}>
          <div className="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-100 dark:border-slate-800">
            <div className="flex items-center gap-1.5">
              <IconTrophy />
              <h3 className="text-xs font-bold text-slate-800 dark:text-slate-200">🧪 실시간 도전 과제 & 보상</h3>
            </div>
            <div className="flex items-center gap-1.5">
              <button 
                onClick={resetProgress}
                title="업적 초기화"
                className="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 transition-colors"
              >
                <IconRotateCcw />
              </button>
              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-mono">
                Score: {xp} XP
              </span>
            </div>
          </div>

          <div className={`flex items-center justify-between px-2.5 py-1.5 rounded-lg border text-[10.5px] font-bold mb-3 ${currentRank.color}`}>
            <span className="flex items-center gap-1.5">
              <IconAward />
              현재 물리 등급
            </span>
            <span>{currentRank.name}</span>
          </div>

          <div className="space-y-2 max-h-[240px] overflow-y-auto pr-1">
            {missions.map(m => {
              const isCompleted = completedList.includes(m.id);
              return (
                <div 
                  key={m.id} 
                  className={`p-2 rounded-lg border flex flex-col gap-1.5 transition-all ${
                    isCompleted 
                      ? 'bg-emerald-500/5 border-emerald-500/20' 
                      : 'bg-slate-50 dark:bg-slate-950 border-slate-100 dark:border-slate-800'
                  }`}
                >
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex items-start gap-2">
                      <div className="mt-0.5 shrink-0">
                        {isCompleted ? (
                          <IconCheckCircle />
                        ) : (
                          <span className="block w-3.5 h-3.5 rounded-full border-2 border-slate-300 dark:border-slate-700 shrink-0" />
                        )}
                      </div>
                      <div>
                        <h4 className={`text-[10.5px] font-bold leading-tight ${
                          isCompleted ? 'text-slate-400 line-through dark:text-slate-500' : 'text-slate-700 dark:text-slate-300'
                        }`}>
                          {m.title}
                        </h4>
                        <p className="text-[9.5px] text-slate-400 dark:text-slate-500 leading-snug mt-0.5">
                          {m.description}
                        </p>
                      </div>
                    </div>
                    <div className="shrink-0 text-right">
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${
                        isCompleted 
                          ? 'bg-slate-100 text-slate-400 dark:bg-slate-900' 
                          : 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-400'
                      }`}>
                        +{m.rewardXp} XP
                      </span>
                    </div>
                  </div>

                  {!isCompleted && (
                    <div className="mt-0.5 space-y-1">
                      <div className="w-full bg-slate-200 dark:bg-slate-800 h-1 rounded-full overflow-hidden">
                        <div 
                          className="bg-indigo-500 h-1 rounded-full transition-all duration-300"
                          style={{ width: `${m.progress}%` }}
                        />
                      </div>
                      <div className="flex justify-between items-center text-[8.5px] text-slate-400 dark:text-slate-500">
                        <span className="flex items-center gap-0.5">
                          <IconHelpCircle />
                          조건: {m.conditionText}
                        </span>
                        <span className="font-mono font-bold">{m.progress}%</span>
                      </div>
                    </div>
                  )}

                  {isCompleted && (
                    <div className="flex items-center gap-1 text-[8.5px] text-emerald-600 dark:text-emerald-500 font-semibold animate-pulse">
                      <IconZap />
                      미션 완료! 보상 XP 획득 성공
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [theme, setTheme] = useState('dark');
      const [simState, setSimState] = useState({
        magnetX: 200,
        magnetY: 85,
        velocity: 0,
        isDragging: false,
        isAutoMoving: false,
        polarity: 'NS',
        turns: 2,
        windingDirection: 'CW',
        angle: 0,
        magnetStrength: 2,
        yOffset: 0,
      });

      const [currentEmf, setCurrentEmf] = useState(0);
      const [emfHistory, setEmfHistory] = useState(() => Array(60).fill(0));

      const handleUpdateEmf = useCallback((val) => {
        setCurrentEmf(val);
        setEmfHistory(prev => [...prev.slice(1), val]);
      }, []);

      const handleReset = () => {
        setSimState({
          magnetX: 200,
          magnetY: 85,
          velocity: 0,
          isDragging: false,
          isAutoMoving: false,
          polarity: 'NS',
          turns: 2,
          windingDirection: 'CW',
          angle: 0,
          magnetStrength: 2,
          yOffset: 0,
        });
        setEmfHistory(Array(60).fill(0));
        setCurrentEmf(0);
      };

      useEffect(() => {
        const cl = document.documentElement.classList;
        if (theme === 'dark') {
          cl.add('dark');
          document.body.style.backgroundColor = '#020617';
        } else {
          cl.remove('dark');
          document.body.style.backgroundColor = '#fafafa';
        }
      }, [theme]);

      return (
        <div className={`min-h-screen py-3 px-3 sm:px-6 font-sans transition-colors duration-300 ${
          theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-slate-50/50 text-slate-900'
        }`}>
          <div className="max-w-7xl mx-auto flex flex-col gap-3">
            <header className="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-2 border-b gap-2 border-slate-200 dark:border-slate-800">
              <div className="flex items-center gap-2">
                <div className="p-1.5 rounded-xl bg-indigo-600 text-white shadow-md animate-pulse">
                  <IconZap />
                </div>
                <div>
                  <h1 className="text-sm font-black tracking-tight flex items-center gap-1">
                    패러데이 전자기 유도 가상 실험실
                    <span className="text-[9px] font-bold bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/20">물리학 Ⅰ</span>
                  </h1>
                  <p className="text-[10px] text-slate-400 dark:text-slate-500">실시간 패러데이 법칙 및 렌츠의 법칙 탐구</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5 self-end sm:self-auto">
                <button onClick={handleReset} className="px-2.5 py-1 text-[10px] font-semibold border rounded-lg transition-colors flex items-center gap-1 bg-white text-slate-700 border-slate-200 hover:bg-slate-50 dark:bg-slate-900 dark:border-slate-800 dark:text-slate-300 dark:hover:bg-slate-800">
                  <IconRotateCcw />초기화
                </button>
                <button onClick={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')} className="p-1.5 border rounded-lg bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800">
                  {theme === 'dark' ? <IconSun /> : <IconMoon />}
                </button>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-start">
              <main className="lg:col-span-8 flex flex-col gap-3">
                <PhysicsCanvas state={simState} setState={setSimState} theme={theme} onUpdateEmf={handleUpdateEmf} />
                <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                  <div className="md:col-span-5"><Galvanometer value={currentEmf * 40} theme={theme} /></div>
                  <div className="md:col-span-7"><EmfGraph data={emfHistory} theme={theme} /></div>
                </div>
              </main>

              <aside className="lg:col-span-4 flex flex-col gap-3">
                {/* Control Panel */}
                <div className={`p-3 rounded-xl border transition-colors duration-300 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100 shadow-sm'}`}>
                  <h2 className="text-xs font-bold pb-2 border-b border-slate-100 dark:border-slate-800 mb-2">실험 제어 및 변인 설정</h2>
                  
                  <div className="space-y-3">
                    <div className="flex items-center justify-between p-1.5 bg-indigo-500/5 rounded-lg border border-indigo-500/15">
                      <div>
                        <span className="text-[10.5px] font-bold block">자석 자동 왕복 운동</span>
                        <span className="text-[9px] text-slate-400">일정한 속도의 왕복 주기 운동</span>
                      </div>
                      <button onClick={() => setSimState(prev => ({ ...prev, isAutoMoving: !prev.isAutoMoving }))} className={`w-8 h-4 rounded-full p-0.5 transition-colors ${simState.isAutoMoving ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-700'}`}>
                        <div className={`w-3 h-3 rounded-full bg-white transition-transform ${simState.isAutoMoving ? 'translate-x-4' : 'translate-x-0'}`} />
                      </button>
                    </div>

                    <div>
                      <span className="text-[10px] font-semibold text-slate-400 block mb-1">자석 극성</span>
                      <div className="grid grid-cols-2 gap-1.5">
                        <button onClick={() => setSimState(prev => ({ ...prev, polarity: 'NS' }))} className={`py-1 text-[10px] font-bold rounded-lg border ${simState.polarity === 'NS' ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 dark:border-slate-800'}`}>S - N [정극]</button>
                        <button onClick={() => setSimState(prev => ({ ...prev, polarity: 'SN' }))} className={`py-1 text-[10px] font-bold rounded-lg border ${simState.polarity === 'SN' ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 dark:border-slate-800'}`}>N - S [역극]</button>
                      </div>
                    </div>

                    <div>
                      <span className="text-[10px] font-semibold text-slate-400 block mb-1">코일 감은 수 (Turns)</span>
                      <div className="grid grid-cols-5 gap-1">
                        {[1, 2, 3, 4, 5].map(t => (
                          <button key={t} onClick={() => setSimState(prev => ({ ...prev, turns: t }))} className={`py-1 text-[10px] font-bold rounded-lg border ${simState.turns === t ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 dark:border-slate-800'}`}>{t}N</button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <span className="text-[10px] font-semibold text-slate-400 block mb-1">코일 감는 방향</span>
                      <div className="grid grid-cols-2 gap-1.5">
                        <button onClick={() => setSimState(prev => ({ ...prev, windingDirection: 'CW' }))} className={`py-1 text-[10px] font-bold rounded-lg border ${simState.windingDirection === 'CW' ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 dark:border-slate-800'}`}>우선회 (CW)</button>
                        <button onClick={() => setSimState(prev => ({ ...prev, windingDirection: 'CCW' }))} className={`py-1 text-[10px] font-bold rounded-lg border ${simState.windingDirection === 'CCW' ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 dark:border-slate-800'}`}>좌선회 (CCW)</button>
                      </div>
                    </div>

                    {/* 진입 각도 조절 */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-[10px] font-semibold text-slate-400">진입 각도 (θ)</span>
                        <span className="text-[10px] font-bold text-emerald-500 font-mono">{simState.angle}°</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="90"
                        step="15"
                        value={simState.angle}
                        disabled={simState.isAutoMoving}
                        onChange={(e) => setSimState(prev => ({ ...prev, angle: parseInt(e.target.value, 10) }))}
                        className="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 disabled:opacity-50"
                      />
                      <div className="flex justify-between text-[8px] text-slate-400 dark:text-slate-500 mt-0.5 font-mono">
                        <span>0° (수직)</span>
                        <span>45°</span>
                        <span>90° (수평차단)</span>
                      </div>
                    </div>

                    {/* 자석 세기 조절 */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-[10px] font-semibold text-slate-400">자석 세기 (B)</span>
                        <span className="text-[10px] font-bold text-rose-500 font-mono">
                          {simState.magnetStrength === 1 ? '약함' : simState.magnetStrength === 3 ? '강함' : '보통'}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="1"
                        max="3"
                        step="1"
                        value={simState.magnetStrength}
                        disabled={simState.isAutoMoving}
                        onChange={(e) => setSimState(prev => ({ ...prev, magnetStrength: parseInt(e.target.value, 10) }))}
                        className="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500 disabled:opacity-50"
                      />
                      <div className="flex justify-between text-[8px] text-slate-400 dark:text-slate-500 mt-0.5 font-mono">
                        <span>1단계 (약)</span>
                        <span>2단계 (중)</span>
                        <span>3단계 (강)</span>
                      </div>
                    </div>

                    {/* 진입 높이 오프셋 조절 */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-[10px] font-semibold text-slate-400">진입 높이 오프셋 (Y-Offset)</span>
                        <span className="text-[10px] font-bold text-amber-500 font-mono">
                          {simState.yOffset === 0 ? '0px' : `${simState.yOffset > 0 ? '+' : ''}${simState.yOffset}px`}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="-40"
                        max="40"
                        step="10"
                        value={simState.yOffset}
                        disabled={simState.isAutoMoving}
                        onChange={(e) => setSimState(prev => ({ ...prev, yOffset: parseInt(e.target.value, 10) }))}
                        className="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500 disabled:opacity-50"
                      />
                      <div className="flex justify-between text-[8px] text-slate-400 dark:text-slate-500 mt-0.5 font-mono">
                        <span>-40px (위)</span>
                        <span>0px (중앙)</span>
                        <span>+40px (아래)</span>
                      </div>
                    </div>
                  </div>
                </div>

                <MissionPanel magnetX={simState.magnetX} velocity={simState.velocity} emf={currentEmf} isAuto={simState.isAutoMoving} turns={simState.turns} polarity={simState.polarity} isDragging={simState.isDragging} theme={theme} />
                <LearningPanel theme={theme} />
              </aside>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
